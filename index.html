<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="descripton" content="Tourism">
  <link rel="stylesheet" href="css/style.css" />
</head>
  
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      color: #333;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 1rem;
    }

    h1 {
      color: #4f46e5;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #3730a3;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world!</h1>
    <p>Welcome to my first webpage.</p>
    <button id="helloButton">Click me</button>
    <p id="message"></p>
  </main>

  <script>
    const button = document.getElementById("helloButton");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      message.textContent = "Hey! Your JavaScript is working 🎉";
    });
  </script>
</body>
</html>
